<div class="mb-4 bg-light p-4 rounded-3 shadow-sm">
  <h2 class="text-center text-primary mb-3">Projetos</h2>
  <p class="text-center text-muted">
    Aqui estão alguns dos meus projetos mais recentes, desenvolvidos com diversas tecnologias.
    Você pode filtrar por tecnologia para encontrar o que mais lhe interessa.
  <label for="filtro" class="form-label">Filtrar por tecnologia:</label>
  <select id="filtro" class="form-select bg-white border rounded-2 shadow-sm bg-light" [(ngModel)]="tecnologiaSelecionada">
    <option value="">Todas</option>
    <option *ngFor="let tech of tecnologiasDisponiveis" [value]="tech">{{ tech }}</option>
  </select>
</div>

<div class="row justify-content-center">
  <div class="col-md-4 mb-4" *ngFor="let projeto of projetosFiltrados()">
    <div class="card border shadow-sm h-100 bg-light">
      <div class="card-body">
        <h5 class="card-title text-primary fw-bold">{{ projeto.nome }}</h5>
        <p class="card-text text-muted">{{ projeto.descricao }}</p>

        <div class="mb-3">
          <span *ngFor="let tech of projeto.tecnologias" class="badge bg-secondary me-1">
            {{ tech }}
          </span>
        </div>

        <a [href]="projeto.link" class="btn btn-outline-primary btn-sm" target="_blank">
          Ver Projeto <i class="bi bi-box-arrow-up-right ms-1"></i>
        </a>
      </div>
    </div>
  </div>
</div>
