<div class="mb-4 bg-light p-4 rounded-3 shadow-sm">
  <h2 class="text-center text-primary mb-3">{{ titulo }}</h2>
  <p class="text-center text-muted">{{ descricao }}</p>
  <label for="filtro" class="form-label">{{ filtroPlaceholder }}:</label>
  <select id="filtro"
          class="form-select bg-white border rounded-2 shadow-sm bg-light mb-5"
          [(ngModel)]="tecnologiaSelecionada">
    <option value="">{{ filtroPlaceholder }}</option>
    <option *ngFor="let tech of tecnologiasDisponiveis" [value]="tech">
      {{ tecnologiaNomes[tech] || tech }}
    </option>
  </select>
</div>

<div class="row justify-content-center">
  <div class="col-md-4 mb-4" *ngFor="let projeto of projetosFiltrados()">
    <div class="card border shadow-sm h-100 bg-light">
      <div class="card-body">
        <h5 class="card-title text-primary fw-bold">{{ projeto.nome }}</h5>
        <p class="card-text text-muted">{{ projeto.descricao }}</p>
        <div class="mb-3">
          <span *ngFor="let tech of projeto.tecnologias" class="badge bg-secondary me-1">
            {{ tecnologiaNomes[tech] || tech }}
          </span>
        </div>
        <a [href]="projeto.link" class="btn btn-outline-primary btn-sm" target="_blank">
          {{ botaoVer }} <i class="bi bi-box-arrow-up-right ms-1"></i>
        </a>
      </div>
    </div>
  </div>
</div>
